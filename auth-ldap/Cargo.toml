[package]
name = "busbar-auth-ldap"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.97"
description = "The AD/LDAP auth module for busbar: BIND a username/password against an LDAP/LDAPS directory and map the user's group memberships (memberOf DNs) to a Principal. Its door (door::door) is a plugin_door! over the auth kind's table (abi::auth v3). Opens its own LDAP socket (like hashicorp-vault), unlike the core-executes-HTTP-hop model of auth-oidc."
license = "Apache-2.0"

[dependencies]
# The ONE busbar crate a plugin names (#40: contract only). Pinned by git rev to the busbar commit in
# `.busbar-ref`; a busbar build that links this crate `[patch]`es the busbar git source to its own
# tree, so ONE copy of the contract links.
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "934a016e20fc1a67c209b671d137c8cc28092767" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# The LDAP client. `sync` gives the blocking LdapConn the door's complete_login runs (MARK_BLOCKS);
# `tls-rustls` stays on the same rustls/ring TLS backend the rest of the plugin ecosystem pins
# (no native-tls / openssl second stack). NOTE: this pulls a tokio runtime in transitively — see the
# `// ABI GAP (async):` note in lib.rs about running blocking LDAP I/O inside the sync FFI call.
ldap3 = { version = "0.11", default-features = false, features = ["sync", "tls-rustls"] }

[dev-dependencies]
serde_json = "1"
