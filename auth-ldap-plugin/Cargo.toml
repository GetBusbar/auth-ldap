# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-ldap-plugin"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.97"
description = "The AD/LDAP auth module as a droppable busbar plugin — a cdylib exporting the auth C ABI. Drop it in the plugins folder and add `ldap` to auth.chain / auth.methods with auth.methods.ldap settings (url, bind_dn_template, base_dn, group_attr)."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
busbar-api = { path = "../../busbarAI/crates/api" }
busbar-plugin-sdk = { path = "../../busbarAI/crates/plugin-sdk" }
busbar-auth-ldap = { path = "../auth-ldap" }
serde_json = "1"
