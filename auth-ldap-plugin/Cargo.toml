# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-auth-ldap-plugin"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.97"
description = "The AD/LDAP auth module as a droppable busbar plugin — a cdylib exporting the auth C ABI. Drop it in the plugins folder and add `ldap` to auth.chain / auth.methods with auth.methods.ldap settings (url, bind_dn_template, base_dn, group_attr)."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The one busbar crate (#40): busbar-contract, whose `abi::sdk` carries the export macro — pinned by
# git rev to `.busbar-ref` field 1.
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "23d8a6b46deb158839df8bc02115b09023633040" }
busbar-auth-ldap = { path = "../auth-ldap" }
serde_json = "1"

[dev-dependencies]
# Dev-only, same pinned busbar rev as busbar-contract (one busbar source resolves): the linked +
# dropped-in conformance test (tests/conformance.rs) signs, packs, scans and opens the built cdylib
# over the REAL loader; and the live plugin-side e2e (tests/e2e.rs) uses it to locate the built cdylib (plugin-loader's
# filename helper), pack it with the real busbar-plugin-pack BINARY (spawned), drive real blocking HTTP
# against a spawned real busbar binary + an OpenLDAP service container, and SEED that directory over
# LDAP (ldap3, the same client the plugin uses — sync + tls-rustls, matching the plugin's own feature
# set).
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "23d8a6b46deb158839df8bc02115b09023633040" }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
ldap3 = { version = "0.11", default-features = false, features = ["sync", "tls-rustls"] }
