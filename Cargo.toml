# SPDX-License-Identifier: Apache-2.0
#
# The AD/LDAP auth module for busbar, as a same-repo Cargo workspace mirroring auth-oidc:
#   - auth-ldap:        the real LDAP BIND + group-read logic (implements busbar_contract::auth::
#                       AuthModule + LoginModule). Opens its OWN LDAP/LDAPS socket (like
#                       hashicorp-vault opens its own HTTPS), NOT the core-executes-hop model oidc uses.
#   - auth-ldap-plugin: the thin dlopen cdylib adapter (export_login_plugin!).
#
# Its one busbar dependency is busbar-contract (#40: a plugin names the contract only; the plugin SDK
# is `busbar_contract::abi::sdk` since the #84 merge), plus busbar-plugin-loader dev-only for the
# conformance and e2e tests — both `git` dependencies on GetBusbar/busbar pinned to the rev in
# `.busbar-ref` field 1. No sibling-checkout path dependency ships in any manifest.
#
# Requires auth ABI v2, the version carrying the credential login flow: login_kind()=Credential,
# begin_login returns Prompt(LoginForm{username,password}), and complete_login reads the submitted map
# (Redacted values), BINDs, and Identifies. `// ABI GAP:` markers in-source mark the two limitations
# the ABI does not yet cover (a secret-ref seam for the service-account password, and blocking I/O in
# a sync FFI call); both are described under Limitations in README.md.
[workspace]
resolver = "2"
members = [
    "auth-ldap",
    "auth-ldap-plugin",
]
