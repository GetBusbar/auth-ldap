# SPDX-License-Identifier: Apache-2.0
#
# The AD/LDAP auth module for busbar, as a same-repo Cargo workspace mirroring auth-oidc:
#   - auth-ldap:        the real LDAP BIND + group-read logic (implements busbar_api::AuthModule
#                       + busbar_api::LoginModule). Opens its OWN LDAP/LDAPS socket (like
#                       hashicorp-vault opens its own HTTPS), NOT the core-executes-hop model oidc uses.
#   - auth-ldap-plugin: the thin dlopen cdylib adapter (export_login_plugin!).
#
# Only busbar-api / busbar-plugin-sdk (and the plugin's dev-deps: busbar-plugin-loader/abi) reach into
# a sibling busbarAI checkout — INTERIM local path deps, same pattern as auth-oidc / hashicorp-vault.
#
# NOTE: this crate began as a STRESS TEST of the 1.5.2 LoginModule ABI; the credential-flow gaps it
# surfaced (LoginKind classification, LoginOutcome::Prompt(LoginForm), the generic submitted map with
# Redacted values, client_secret made Optional) then LANDED in the frozen auth ABI v2. It now
# implements the full LDAP credential flow against that v2 ABI: login_kind()=Credential, begin_login
# returns Prompt(LoginForm{username,password}), and complete_login reads the submitted map, BINDs, and
# Identifies. Remaining `// ABI GAP:` markers are the additive-later items only (secret-ref for the
# service-account password, sync/blocking I/O), catalogued in README.md.
[workspace]
resolver = "2"
members = [
    "auth-ldap",
    "auth-ldap-plugin",
]
